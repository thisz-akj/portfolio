name: ops-ai (Python)

# Python side of the Ops Suite demo.
#  - tests:    every push/PR touching ops-ai (no secrets, no network)
#  - insights: nightly at 22:00 UTC (03:30 IST), 30 min after the demo reset cron, recomputes dashboard signals
#  - eval:     manual only (it calls Claude and costs money): Actions → ops-ai → Run workflow → run_eval
# Secrets: DATABASE_URL (Neon pooled URL) for insights/eval, ANTHROPIC_API_KEY for eval.

on:
  push:
    paths: ["ops-ai/**", ".github/workflows/ops-ai.yml"]
  pull_request:
    paths: ["ops-ai/**"]
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      run_eval:
        description: "Run the Claude eval (costs API credits)"
        type: boolean
        default: false
      efforts:
        description: "Space-separated effort levels to compare"
        default: "low medium"

defaults:
  run:
    working-directory: ops-ai

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ops-ai/requirements.txt }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  insights:
    needs: tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ops-ai/requirements.txt }
      - run: pip install -r requirements.txt
      - name: Recompute signals
        if: env.DATABASE_URL != ''
        run: python -m ops_ai.insights

  eval:
    needs: tests
    if: github.event_name == 'workflow_dispatch' && inputs.run_eval
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ops-ai/requirements.txt }
      - run: pip install -r requirements.txt
      - name: Evaluate Ask Ops Suite
        run: python -m ops_ai.eval $(for e in ${{ inputs.efforts }}; do echo --effort "$e"; done)
